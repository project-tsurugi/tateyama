syntax = "proto3";

package tateyama.grpc.proto;

message RemoteExecutionBlock {
  uint32 version = 1;
  repeated Operator operators = 2;
  repeated uint64 value_ids = 3;
  repeated uint64 stream_variable_ids = 4;
  repeated ScalarExpression scalar_expressions = 5;
  repeated uint64 external_relation_ids = 6;
  ResultSchema result_schema = 7;
  uint64 result_value_id = 8;
}

message Operator {
  uint64 operator_id = 1;
  OperatorKind kind = 2;
  // Explicit presence, including zero, for older Protobuf generators.
  oneof input_value_id_presence {
    uint64 input_value_id = 3;
  }
  // Explicit presence, including zero, for older Protobuf generators.
  oneof output_value_id_presence {
    uint64 output_value_id = 4;
  }
  Source source = 5;
  // Explicit presence, including zero, for older Protobuf generators.
  oneof filter_expression_id_presence {
    uint64 filter_expression_id = 6;
  }
  repeated ProjectColumn project_columns = 7;
  Offer offer = 8;
}

enum OperatorKind {
  OPERATOR_KIND_UNSPECIFIED = 0;
  OPERATOR_KIND_SCAN = 1;
  OPERATOR_KIND_FIND = 2;
  OPERATOR_KIND_FILTER = 3;
  OPERATOR_KIND_PROJECT = 4;
  OPERATOR_KIND_OFFER = 5;
}

message StorageReference {
  // Explicit presence, including zero, for older Protobuf generators.
  oneof definition_id_presence {
    uint64 definition_id = 1;
  }
  string table_name = 2;
  string index_name = 3;
}

message Source {
  StorageReference storage = 1;
  repeated SourceColumn columns = 2;
  Endpoint lower = 3;
  Endpoint upper = 4;
  repeated uint64 find_key_expression_ids = 5;
  // Explicit presence, including zero, for older Protobuf generators.
  oneof limit_presence {
    uint64 limit = 6;
  }
}

message SourceColumn {
  string column_name = 1;
  uint64 destination_variable_id = 2;
}

message Endpoint {
  EndpointKind kind = 1;
  repeated uint64 key_expression_ids = 2;
}

enum EndpointKind {
  ENDPOINT_KIND_UNBOUND = 0;
  ENDPOINT_KIND_INCLUSIVE = 1;
  ENDPOINT_KIND_EXCLUSIVE = 2;
  ENDPOINT_KIND_PREFIXED_INCLUSIVE = 3;
  ENDPOINT_KIND_PREFIXED_EXCLUSIVE = 4;
}

message ScalarExpression {
  uint64 expression_id = 1;
  ScalarExpressionKind kind = 2;
  string operator_kind = 3;
  string value_kind = 4;
  string value = 5;
  string type = 6;
  // Explicit presence, including zero, for older Protobuf generators.
  oneof variable_id_presence {
    uint64 variable_id = 7;
  }
  repeated uint64 operand_expression_ids = 8;
  bytes type_payload = 9;
  bytes literal_payload = 10;
}

enum ScalarExpressionKind {
  SCALAR_EXPRESSION_KIND_UNSPECIFIED = 0;
  SCALAR_EXPRESSION_KIND_IMMEDIATE = 1;
  SCALAR_EXPRESSION_KIND_VARIABLE_REFERENCE = 2;
  SCALAR_EXPRESSION_KIND_UNARY = 3;
  SCALAR_EXPRESSION_KIND_CAST = 4;
  SCALAR_EXPRESSION_KIND_BINARY = 5;
  SCALAR_EXPRESSION_KIND_COMPARE = 6;
}

message ProjectColumn {
  uint64 destination_variable_id = 1;
  uint64 value_expression_id = 2;
}

message Offer {
  uint64 external_relation_id = 1;
  repeated OfferColumn columns = 2;
}

message OfferColumn {
  uint64 source_variable_id = 1;
  uint64 destination_column_id = 2;
}

message ResultSchema {
  repeated ResultColumn columns = 1;
}

message ResultColumn {
  uint64 column_id = 1;
  string type = 2;
  bool nullable = 3;
  bytes type_payload = 4;
}

